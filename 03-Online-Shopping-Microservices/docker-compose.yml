services:

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5001:5000"
    depends_on:
      - product-service
      - user-service
    networks:
      - app-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5000"
    networks:
      - app-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5003:5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge